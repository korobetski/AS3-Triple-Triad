name: Build and Test

# The Gradle build lives in `kotlin/`, not at the repository root: the root has no
# settings.gradle.kts, so every job sets `working-directory: kotlin`.
#
# The default branch of this repository is `master`. A workflow keyed on `main` would
# never fire.
on:
  push:
    branches: [master, 'migration/**']
    paths:
      - 'kotlin/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'kotlin/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kotlin

jobs:
  # Static analysis first and on its own: it is the fastest signal and a formatting
  # failure should not wait on a two-minute Android build.
  quality:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt --no-daemon
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            kotlin/*/build/reports/ktlint/
            kotlin/*/build/reports/detekt/

  # `:shared:build` covers the common + desktop + Android library compilations, the
  # 13 common tests on three targets and the 8 Compose UI tests on desktop.
  shared:
    name: Shared module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # compileSdk is 36; the runner image does not always carry it, and there is no
      # local.properties on CI so AGP relies on ANDROID_HOME.
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :shared:build --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-results
          path: kotlin/shared/build/test-results/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: kotlin/androidApp/build/outputs/apk/*/*.apk

  desktop:
    name: Desktop JAR
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:build --no-daemon

  # The only job that can compile the Apple targets at all: Kotlin/Native silently skips
  # them on a Linux or Windows host, so a green build elsewhere says nothing about iOS.
  #
  # This builds and tests the shared *framework* only. It does NOT build an iOS app,
  # because `kotlin/iosApp` has no .xcodeproj — the Swift sources are there but there is
  # no Xcode project to drive them. Adding an `xcodebuild` step before that project
  # exists would fail on every run.
  ios-framework:
    name: iOS framework (shared only)
    runs-on: macos-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - name: Upload framework
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework
          path: kotlin/shared/build/bin/iosSimulatorArm64/debugFramework/
