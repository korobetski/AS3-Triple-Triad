name: Build and Test

# The Gradle build is the repository root: `settings.gradle.kts`, `gradlew` and the three
# modules all live here. It used to sit in a `kotlin/` subdirectory, which is why every job
# once carried `working-directory: kotlin`; that is gone.
#
# The default branch of this repository is `master`. A workflow keyed on `main` would
# never fire.
#
# Jobs are deliberately NOT gated behind `needs:`. Measured on run #3, the `needs: shared`
# chain made the wall clock 12m23s (shared 4m33s then ios-framework 7m46s) when the longest
# single job is 7m46s. None of these jobs consumes another's output — each runs its own Gradle
# invocation — and this repository is public, so standard runners including macos-latest are
# free. There are no minutes to conserve by failing fast.
#
# Action versions: every action here declares `using: node24`. The first CI run warned
# that checkout/setup-java/upload-artifact v4 and setup-android v3 target Node 20 and were
# being forced onto Node 24; these majors are the ones that target it natively.
#
# `gradle/actions/setup-gradle` is deliberately pinned to v5 and NOT v6. v5 is the oldest
# major that runs on Node 24, and v6 moves the caching code into a proprietary
# `gradle-actions-caching` component whose use implies accepting Gradle's Terms of Use
# (https://blog.gradle.org/github-actions-for-gradle-v6). That is a licensing decision, not
# a maintenance one, so it is not taken here by default. v5 clears the Node 20 warning and
# stays MIT.
on:
  push:
    branches: [master, 'migration/**']
    # `paths-ignore` and not `paths`: now that the build is the repository root, an
    # allow-list would have to name every module and be edited whenever one is added, and
    # forgetting to would silently stop building it. Skipping a docs-only change is the
    # cheap mistake; not building a code change is the expensive one.
    #
    # `sources/**` is the read-only AS3 original. The artwork is copied out of it into
    # `shared/src/commonMain/composeResources/` by `tools/import_card_art.py`, so editing
    # the AS3 tree cannot change what gets built until that script is re-run — and the
    # script's output is not in `sources/`.
    paths-ignore:
      - 'docs/**'
      - 'sources/**'
      - '**/*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'sources/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis first and on its own: it is the fastest signal and a formatting
  # failure should not wait on a two-minute Android build.
  quality:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew ktlintCheck detekt --no-daemon
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            */build/reports/ktlint/
            */build/reports/detekt/

  # `:shared:build` covers the common + desktop + Android library compilations: the 77 common
  # tests on two targets (`desktopTest` and `testAndroidHostTest`) plus the 18 desktop-only
  # ones, 172 executions. The Android half runs under `testAndroidHostTest` and not
  # `testDebugUnitTest` since the module moved to `com.android.kotlin.multiplatform.library`;
  # nothing here names the task, but the uploaded results directory is named after it.
  shared:
    name: Shared module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      # compileSdk is 36; the runner image does not always carry it, and there is no
      # local.properties on CI so AGP relies on ANDROID_HOME.
      - uses: android-actions/setup-android@v4
      # `:shared:build` already runs `coverageVerify`, which is wired into `check`. The
      # report task is named here as well so the HTML exists to upload even on the runs
      # where the gate passes and Gradle would otherwise have nothing to produce.
      - run: ./gradlew :shared:build :shared:coverageReport --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shared-test-results
          path: shared/build/test-results/
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shared-coverage
          path: shared/build/reports/jacoco/coverageReport/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: android-apks
          path: androidApp/build/outputs/apk/*/*.apk

  desktop:
    name: Desktop JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :desktopApp:build --no-daemon

  # The only job that can compile the Apple targets at all: Kotlin/Native silently skips
  # them on a Linux or Windows host, so a green build elsewhere says nothing about iOS.
  #
  # This builds and tests the shared *framework* only. It does NOT build an iOS app,
  # because `iosApp/` has no .xcodeproj — the Swift sources are there but there is no
  # Xcode project to drive them. Adding an `xcodebuild` step before that project exists
  # would fail on every run.
  ios-framework:
    name: iOS framework (shared only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
      - name: Upload framework
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ios-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/
